name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  GO_VERSION: "1.25"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "${{ env.GO_VERSION }}"
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Unit tests
        run: go test ./... -count=1

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2

      - name: Swagger sync
        run: go test ./test/... -count=1 -run TestKYCRoutesDocumented

      - name: Migration check
        run: bash scripts/check-migrations.sh

      - name: Integration tests
        if: success() || failure()
        run: go test -tags=integration ./test/integration/... -count=1

      - name: Coverage
        if: success() || failure()
        run: bash scripts/check-coverage.sh
